<!--

  - 單一 HTML、零後端、不需金鑰；進度存在瀏覽器 localStorage

<style>
:root{--bg:#1b1d2a;--panel:#262a3d;--line:#0d0e15;--ink:#f3ecd8;--mut:#a9a39a;--gold:#ffd166;--red:#ef6f6c;--green:#7bd389;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
#app{max-width:1260px;margin:0 auto;padding:10px;}
#hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #3c4260;padding:8px 10px;margin-bottom:8px;}
#hud .day{font-weight:700;color:var(--gold);min-width:210px}
#hud .clock{font-family:monospace;font-size:22px;background:#111;padding:2px 10px;border:2px solid #000;color:#9ff0b0;letter-spacing:1px}
.stat{display:flex;flex-direction:column;font-size:12px;min-width:92px}
.stat .bar{height:9px;background:#111;border:2px solid #000;margin-top:2px}
.stat .bar i{display:block;height:100%}
#main{display:flex;gap:8px;align-items:flex-start}
#stage{position:relative;flex:1;border:3px solid var(--line);background:#000;line-height:0}
#cv{width:100%;height:auto;image-rendering:pixelated;display:block}
#side{width:270px;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #3c4260;padding:8px;font-size:13px}
#side h3{margin:4px 0 6px;font-size:14px;color:var(--gold)}
#todo div{padding:4px 2px;border-bottom:1px dashed #444a66;line-height:1.35}
#todo .done{color:#7f8a7f;text-decoration:line-through}
#todo .missed{color:#a86a68}
#todo .act{color:#fff;font-weight:700}
#mini{width:100%;image-rendering:pixelated;border:2px solid #000;margin-top:2px}
.btn{background:#3d4566;color:var(--ink);border:2px solid #000;box-shadow:inset -2px -2px 0 #2a3048,inset 2px 2px 0 #59628a;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{background:#4c5680}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:#b8862b;box-shadow:inset -2px -2px 0 #7d5a1a,inset 2px 2px 0 #e0b04e}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#dlg{position:absolute;left:2%;right:2%;bottom:3%;display:flex;gap:12px;background:#f3ecd8;color:#2a2622;border:4px solid #1a1612;box-shadow:0 0 0 4px #f3ecd8,0 0 0 8px #1a1612;padding:12px;line-height:1.6;font-size:15px;max-height:78%;overflow:auto}
#dlg[hidden]{display:none}
#dPt{flex:0 0 84px;text-align:center}
#dPt img{width:84px;height:84px;image-rendering:pixelated;background:#d8cdb2;border:3px solid #1a1612}
#dPt .emo{display:block;width:84px;height:84px;line-height:84px;font-size:44px;background:#d8cdb2;border:3px solid #1a1612}
#dName{font-weight:700;color:#7a3b1f;margin-bottom:2px}
#dText{white-space:pre-wrap}
#dFx{margin-top:6px;font-size:13px;color:#3a5a3a;font-weight:700}
#dChoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ch{text-align:left;background:#fffaf0;border:3px solid #1a1612;padding:7px 10px;cursor:pointer;font:inherit;font-size:14px;color:#2a2622}
.ch:hover{background:#ffe9b8}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch .k{display:inline-block;background:#1a1612;color:#f3ecd8;padding:0 6px;margin-right:6px;font-family:monospace}
.ch .sub{display:block;font-size:12px;color:#7a6f60;margin-top:2px}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;line-height:1.4;width:90%}
.tst{background:#1a1612ee;border:2px solid #f3ecd8;padding:6px 12px;font-size:14px;max-width:100%;transition:opacity .5s}
.tst.warn{border-color:var(--gold);color:var(--gold)}
.tst.bad{border-color:var(--red);color:#ffd0ce}
.tst.good{border-color:var(--green);color:#d6ffde}

#modal[hidden]{display:none}
#mbox{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #3c4260;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px 24px;line-height:1.7}

#mbox h2{color:var(--gold);margin:0 0 8px}
#mbox h3{color:var(--gold);margin:14px 0 4px;font-size:16px}
.mut{color:var(--mut)}
.card{background:#1e2233;border:2px solid #000;padding:10px 12px;margin:8px 0}
.quote{border-left:4px solid var(--gold);padding:4px 10px;margin:6px 0;background:#1e2233}
.cite{font-size:12px;color:var(--mut);white-space:pre-wrap}
table.lg{width:100%;border-collapse:collapse;font-size:13px}
table.lg td{border-bottom:1px solid #3c4260;padding:4px;vertical-align:top}
.pos{color:var(--green)}.neg{color:var(--red)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid #888;margin-left:4px;color:#ddd}
#pad{display:none;margin-top:8px;gap:8px;justify-content:space-between;align-items:center}
#pad .dp{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
#pad button{font-size:20px}
@media (max-width:980px){#main{flex-direction:column}#side{width:100%}#pad{display:flex}}

.ppl{display:flex;gap:10px;align-items:center;border-bottom:1px solid #3c4260;padding:6px 0}
.ppl img{width:48px;height:48px;image-rendering:pixelated;background:#1e2233;border:2px solid #000}
</style>
</head>

<script>
/* ============ GEN：抽自 v2 leadership_modes.py（MODES／THEORY／LEVELS），請勿手改引用 ============ */
const GEN = {"MODES": {"bureaucratic": {"label": "科層模式", "subtitle": "依法行政、層級節制、正式程序"}, "servant": {"label": "僕人領導", "subtitle": "傾聽、成全、以人的成長為先"}, "system": {"label": "系統領導", "subtitle": "跨界協作、共善共好、系統思維"}, "distributed": {"label": "分散式領導", "subtitle": "領導不由階層決定，而由任務與專長決定"}, "middle": {"label": "中層領導", "subtitle": "承上啟下、居間協調、以關係信任撬動改變"}, "teacher": {"label": "教師領導", "subtitle": "非正式權威、以同儕關係與專業影響力帶動改變"}}, "THEORY": {"bureaucratic.directive": {"key": "weber_rules", "quote": "Weber（1947）指出，理性—法定型權威的科層組織依賴明確成文的規則與程序運作，決策不因人設事，而是依循既定規範一體適用。", "cite": "Weber, M. (1947). The theory of social and economic organization (A. M. Henderson & T. Parsons, Trans.). Free Press."}, "bureaucratic.formal_meeting": {"key": "weber_hierarchy", "quote": "Weber（1947）描述的科層體制核心特徵之一，是清楚的權威層級與職權分工——每個職位有明確的職責範圍，決策依層級逐級確認。", "cite": "Weber, M. (1947). The theory of social and economic organization (A. M. Henderson & T. Parsons, Trans.). Free Press."}, "bureaucratic.escalate": {"key": "bolman_structural", "quote": "Bolman 與 Deal（2017）在組織的四重框架理論中，將「結構框架」定義為透過正式角色、規則與層級權威來達成組織目標的治理方式。", "cite": "Bolman, L. G., & Deal, T. E. (2017). Reframing organizations: Artistry, choice, and leadership (6th ed.). Jossey-Bass."}, "servant.listen": {"key": "greenleaf_listen", "quote": "Greenleaf（1977）提出僕人領導的核心命題：真正的領導始於「先有服務他人的渴望」，而非先有領導他人的企圖。", "cite": "Greenleaf, R. K. (1977). Servant leadership: A journey into the nature of legitimate power and greatness. Paulist Press."}, "servant.remove_obstacle": {"key": "greenleaf_steward", "quote": "Greenleaf（1977）提出檢驗僕人領導成效的著名標準：「被服務的人是否因此成長？他們在被服務的過程中，是否變得更健康、更有智慧、更自由、更能自主，也更可能成為服務他人的人？」主動移除對方推動政策時面臨的實際障礙，正是這種「管家精神」（stewardship）的具體展現——資源與權限用來成全他人，而非鞏固領導者自身的地位。", "cite": "Greenleaf, R. K. (1977). Servant leadership: A journey into the nature of legitimate power and greatness. Paulist Press."}, "servant.empower": {"key": "spears_growth", "quote": "Spears（1998）整理 Greenleaf 的思想，歸納出僕人領導者的十大特質，其中「對他人成長的承諾」（commitment to the growth of people）強調領導者相信每個人都有超越目前職責之外的內在價值，並主動創造條件讓對方能發展、能主導。", "cite": "Spears, L. C. (Ed.). (1998). Insights on leadership: Service, stewardship, spirit, and servant-leadership. John Wiley & Sons."}, "system.guiding": {"key": "sys_guiding", "quote": "Hopkins（2007）指出，系統領導者的角色之一是「示範者」——透過分享自己單位的成功實踐，協助夥伴建立能力。", "cite": "Hopkins, D. (2007). Every school a great school. McGraw-Hill.\nFullan, M. (2005). Systems thinkers in action. DfES."}, "system.collab": {"key": "sys_collab", "quote": "Hargreaves（2012）認為，成熟的自我改善系統需要建立「夥伴關係能力」：領導者必須主動建構組織與個人的網絡連結、建立彼此自發性的共同目標，並設計相互評估的機制。", "cite": "Hargreaves, D. H. (2012). A self-improving school system: towards maturity. National College for School Leadership."}, "system.empowering": {"key": "sys_empowering", "quote": "Hopkins（2007）強調，系統領導者最核心的特質是具備「道德目的」（moral purpose）——不只關心自己單位的表現，更致力於讓整個系統更好。", "cite": "Hopkins, D. (2007). Every school a great school. McGraw-Hill.\nHarris, A., Jones, M., & Hashim, N. (2021). System leaders and system leadership. School Leadership & Management, 41(4-5), 387-408."}, "distributed.directive": {"key": "dist_directive", "quote": "Timperley（2005）指出，傳統領導研究長期以「英雄式領導者」為預設，認為成敗繫於一位具有例外能力的領導者。", "cite": "Timperley, H. S. (2005). Distributed leadership: developing theory from practice. Journal of Curriculum Studies, 37(4), 395-420."}, "distributed.dialogic": {"key": "dist_dialogic", "quote": "Spillane、Halverson 與 Diamond（2004）主張，領導實踐不是個人特質或行為，而是領導者在特定脈絡中與他人互動所產生的活動——是「在情境中行動的行動者」所建構的過程。", "cite": "Spillane, J. P., Halverson, R., & Diamond, J. B. (2004). Towards a theory of leadership practice: A distributed perspective. Journal of Curriculum Studies, 36(1), 3-34."}, "distributed.empowering": {"key": "dist_empowering", "quote": "Timperley（2005）引用 Copland（2003）的定義：「誰領導、誰跟隨，由任務或問題情境決定，而不是由一個人在階層中的位置決定。", "cite": "Timperley, H. S. (2005). Distributed leadership: developing theory from practice. Journal of Curriculum Studies, 37(4), 395-420.\nCopland, M. A. (2003). Leadership of inquiry. Educational Evaluation and Policy Analysis, 25(4), 375-395."}, "middle.bridge": {"key": "middle_bridge", "quote": "De Nobile（2017）提出中層領導的理論模型，指出中層領導者同時扮演「橋接者」的角色——一方面把校務政策轉譯成教師能理解、能執行的具體做法，另一方面把教師的處境與心聲帶回給校長與行政團隊。", "cite": "De Nobile, J. (2017). Towards a theoretical model of middle leadership in schools. School Leadership & Management. https://doi.org/10.1080/13632434.2017.1411902"}, "middle.secure_conditions": {"key": "middle_conditions", "quote": "Bryant（2018）以香港學校為案例，指出中層領導者要能發揮組織與系統層次的領導力，需要一系列結構條件的支持——包括正式的授權、足夠的時間，以及來自校長的明確信任與後盾。", "cite": "Bryant, D. A. (2018). Conditions that support middle leaders' work in organisational and system leadership: Hong Kong case studies. School Leadership & Management. https://doi.org/10.1080/13632434.2018.1489790"}, "middle.peer_inquiry": {"key": "middle_trust", "quote": "Edwards-Groves、Grootenboer 與 Rönnerman（2016）的研究指出，校本行動研究是建立「關係信任」（relational trust）的重要場域，而中層領導者在其中扮演關鍵的促成角色。", "cite": "Edwards-Groves, C., Grootenboer, P., & Rönnerman, K. (2016). Facilitating a culture of relational trust in school-based action research: Recognising the role of middle leaders. Educational Action Research. https://doi.org/10.1080/09650792.2015.1131175"}, "teacher.build_collegial": {"key": "teacher_collegial", "quote": "Hairon、Goh 與 Chua（2015）以民族誌案例研究分析教師領導如何支持專業學習社群（PLC）的對話，歸納出教師領導展現的三個構面，其中第一個構面是「建立同儕與協作關係」（building collegial and collaborative relations）。", "cite": "Hairon, S., Goh, J. W. P., & Chua, C. S. K. (2015). Teacher leadership enactment in professional learning community contexts: Towards a better understanding of the phenomenon. School Leadership & Management, 35(2), 163-182."}, "teacher.promote_learning": {"key": "teacher_learning", "quote": "Hairon、Goh 與 Chua（2015）指出的第二個教師領導構面，是「促進教師學習與專業發展」（promoting teacher learning and development）。", "cite": "Hairon, S., Goh, J. W. P., & Chua, C. S. K. (2015). Teacher leadership enactment in professional learning community contexts: Towards a better understanding of the phenomenon. School Leadership & Management, 35(2), 163-182."}, "teacher.drive_practice_change": {"key": "teacher_practice", "quote": "Hairon、Goh 與 Chua（2015）提出的第三個教師領導構面，是「促成教學實踐的改變」（enabling change in teaching practice）——教師領導者最終要能帶動同儕實際在課堂中嘗試新做法，而不只停留在關係經營與知識分享。", "cite": "Hairon, S., Goh, J. W. P., & Chua, C. S. K. (2015). Teacher leadership enactment in professional learning community contexts: Towards a better understanding of the phenomenon. School Leadership & Management, 35(2), 163-182.\n陳佩英（2008）。教師領導之興起與發展。教育研究月刊，171，41。"}}, "LEVELS": [{"min": 0, "max": 20, "label": "抗拒", "color": "#e53e3e"}, {"min": 21, "max": 40, "label": "觀望", "color": "#dd6b20"}, {"min": 41, "max": 60, "label": "中立", "color": "#d69e2e"}, {"min": 61, "max": 80, "label": "支持", "color": "#38a169"}, {"min": 81, "max": 100, "label": "系統夥伴", "color": "#276749"}]};

/* ============ 基本常數 ============ */
const T = 48, PX = 3;                 // 一格 48px（16 像素 ×3）

const costOf = c => c ? Math.max(5, Math.round(c * COST_MULT / 5) * 5) : 0;              // 現實 0.6 秒＝遊戲 1 分鐘（一天全程閒置約 5.4 分鐘）
const SAVE_KEY = 'qinghe_principal_day_v6';
const STAT = { m: '教師士氣', l: '學生學習', p: '家長信任', a: '行政效能', b: '經費', e: '體力' };
const STAT_COLOR = { m: '#f4a259', l: '#5bc0eb', p: '#f25f5c', a: '#9bc53d', b: '#ffd166', e: '#c792ea' };
const $ = id => document.getElementById(id);
const fmt = t => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');

const val = x => typeof x === 'function' ? x(S) : x;

/* ============ 人物（皆為虛構） ============ */

    const c = document.createElement('canvas'); c.width = 200; c.height = 150; const x = c.getContext('2d');
    const col = { '.': '#4f8f44', '=': '#bfae86', T: '#d9d1c0', F: '#c39660', L: '#7f6aa0', K: '#c6d3dc', r: '#b8573b', g: '#4f9a46', G: '#f1c40f', D: '#7a3b2e', '#': '#3a2c24' };
    for (let y = 0; y < MH; y++) for (let xx = 0; xx < MW; xx++) { x.fillStyle = obj[y][xx] === 't' ? '#2e6b2e' : col[base[y][xx]] || '#000'; x.fillRect(xx * s, y * s, s, s); }
    drawMini.base = c;
  }
  m.drawImage(drawMini.base, 0, 0);
  if (!S) return;
  const blink = Math.floor(t / 400) % 2;
  NPCS_NOW.forEach(n => { if (n.ev && evActive(n.ev)) { m.fillStyle = n.ev.main ? '#ffd166' : blink ? '#ff2d2d' : '#ffffff'; m.fillRect(n.x / T * s - 3, n.y / T * s - 5, 6, 6); } });
  if (today().events.some(ev => ev.npc === 'desk' && evActive(ev))) { m.fillStyle = blink ? '#ff2d2d' : '#fff'; m.fillRect(4.5 * s - 3, 3.5 * s - 3, 6, 6); }
  m.fillStyle = '#000'; m.fillRect(player.x / T * s - 4, player.y / T * s - 6, 8, 8);
  m.fillStyle = '#ffe600'; m.fillRect(player.x / T * s - 3, player.y / T * s - 5, 6, 6);
}

/* ============ HUD／待辦 ============ */
function renderHUD() {
  if (!S) { $('hud').innerHTML = '<div class="day">校長的一天｜青禾國小</div>'; $('todo').innerHTML = ''; return; }
  const d = today();
  let h = `<div class="day">第 ${S.day + 1} 天｜${d.date} ${d.title}</div><div class="clock">${fmt(S.clock)}</div>`;
  for (const k of ['m', 'l', 'p', 'a', 'b', 'e']) {
    const v = S.stats[k], w = k === 'b' ? clamp(v / 40 * 100, 0, 100) : v;
    h += `<div class="stat"><span>${STAT[k]}　<b>${v}${k === 'b' ? ' 萬' : ''}</b></span><div class="bar"><i style="width:${w}%;background:${STAT_COLOR[k]}"></i></div></div>`;
  }
  $('hud').innerHTML = h;
  const rows = d.events.filter(evOK).sort((a, b) => a.start - b.start).map(ev => {
    const st = S.ev[ev.id], act = evActive(ev);
    const cls = st === 'done' ? 'done' : st === 'missed' ? 'missed' : act ? 'act' : '';
    const ic = st === 'done' ? '✔' : st === 'missed' ? '✖' : act ? (ev.main ? '★' : '❗') : '⏳';
    return `<div class="${cls}">${ic} ${ev.main ? fmt(ev.start) + '–' + fmt(ev.end) : act ? '進行中（' + fmt(ev.start) + ' 起）' : st ? fmt(ev.start) : fmt(ev.start) + ' 起'}<br>${ev.main ? '<b>' : ''}${ev.title}${ev.main ? '</b>' : ''}<span class="mut">（${ev.loc}）</span></div>`;
  });
  $('todo').innerHTML = rows.join('') || '<div class="mut">目前沒有待辦</div>';
}
function toast(msg, cls) {
  const el = document.createElement('div'); el.className = 'tst ' + (cls || ''); el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 600); }, 4200);
}

/* ============ 一天的開始與結束 ============ */
function openModal(html) { $('mbox').innerHTML = html; $('modal').hidden = false; $('mbox').scrollTop = 0; const b = $('mbox').querySelector('.btn.gold'); if (b) setTimeout(() => { b.focus({ preventScroll: true }); $('mbox').scrollTop = 0; }, 0); }
function closeModal() { $('modal').hidden = true; }
function startDay(i, recover = false) {
  S.day = i; S.nextDay = null; S.clock = DAY_START; S.ev = {}; S.calls = {}; S.warned = {}; S.dayTally = {}; S.dayLog = []; S.deskUses = 0;
  if (recover) S.stats.e = clamp(60 + Math.floor(S.stats.e / 2), 0, 100);
  S.dayStart = Object.assign({}, S.stats);
  const d = today();
  player.x = d.spawn[0] * T; player.y = d.spawn[1] * T + T - 4; player.dir = 'up';
  save(); renderHUD();
  mode = 'modal';
  openModal(`<h2>第 ${i + 1} 天｜${d.date}　${d.title}</h2><p style="white-space:pre-wrap">${d.intro}</p><div class="card">${d.focus}</div>
    <p class="mut">你的體力：${S.stats.e}${i > 0 ? '（昨天的疲勞會帶到今天）' : ''}</p><div class="row"><button class="btn gold" id="go">開始這一天 ▶</button></div>`);
  $('go').onclick = () => { closeModal(); mode = 'play'; checkTimers(); };
}
const modeOf = th => th ? th.split('.')[0] : null;
function topMode(tally) {
  const cnt = {}; for (const k in tally) { const m = modeOf(k); cnt[m] = (cnt[m] || 0) + tally[k]; }
  const ms = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  if (!ms.length) return null;
  const m = ms[0]; const arch = Object.keys(tally).filter(k => modeOf(k) === m).sort((a, b) => tally[b] - tally[a])[0];
  return { m, arch, cnt, order: ms };
}
function theoryHTML(arch) {
  const th = GEN.THEORY[arch]; if (!th) return '';
  return `<div class="quote">${th.quote}</div><div class="cite">${th.cite}</div>`;
}
function endDay() {
  if (mode === 'modal' || mode === 'summary') return;
  mode = 'summary'; $('dlg').hidden = true;
  checkTimers();
  const d = today(), delta = {};
  for (const k in S.stats) delta[k] = S.stats[k] - S.dayStart[k];
  S.history.push({ day: S.day, title: d.title, delta, tally: Object.assign({}, S.dayTally) });
  const tm = topMode(S.dayTally);
  const dl = Object.keys(delta).filter(k => k !== 'e').map(k => `<span class="${delta[k] >= 0 ? 'pos' : 'neg'}">${STAT[k]} ${delta[k] >= 0 ? '+' : ''}${delta[k]}${k === 'b' ? ' 萬' : ''}</span>`).join('　');
  const log = S.dayLog.filter(x => x.title !== '等待').map(x => {
    const md = x.th ? `<span class="tag">${GEN.MODES[modeOf(x.th)].label}</span>` : '';
    return `<tr><td class="mut">${fmt(x.t)}</td><td><b>${x.title}</b>${md}<br>${x.missed ? `<span class="neg">${x.note || '錯過了'}</span>` : x.pick}${x.gated ? '<br><span class="neg">（對方信任不足，效果打了折扣）</span>' : ''}<br><span class="mut" style="font-size:12px">${x.fx || ''}</span></td></tr>`;
  }).join('');
  let modeHTML = '<p class="mut">今天你沒有做出明顯帶有領導風格的決定。</p>';
  if (tm) {
    const M = GEN.MODES[tm.m];
    modeHTML = `<p>今天你最常使用的是 <b style="color:var(--gold)">${M.label}</b>（${M.subtitle}），共 ${tm.cnt[tm.m]} 次。` +
      (tm.order.length > 1 ? `其次是 ${tm.order.slice(1).map(m => GEN.MODES[m].label + ' ' + tm.cnt[m] + ' 次').join('、')}。` : '') + `</p>` + theoryHTML(tm.arch);
  }
  const last = S.day + 1 >= DAYS.length;
  S.nextDay = S.day + 1; save();  // 重新整理時從下一天接續
  openModal(`<h2>🌇 第 ${S.day + 1} 天結束｜${d.title}</h2><div class="card">${dl}</div>
    <h3>📖 今天的領導風格揭曉</h3>${modeHTML}
    <h3>📝 今天發生的事</h3><table class="lg">${log || '<tr><td class="mut">今天什麼事都沒處理。</td></tr>'}</table>
    <h3>💭 反思一下</h3><div class="card">${d.question}</div>
    <div class="row"><button class="btn gold" id="next">${last ? '看第一階段總結 ▶' : '前往下一天 ▶'}</button></div>`);
  $('next').onclick = () => { closeModal(); if (last) showFinal(); else startDay(S.day + 1, true); };
}
function showFinal() {
  mode = 'modal';
  const tm = topMode(S.tally);
  const P = S.flags.proposal;
  const pText = { passed: '共備提案通過，全校開始每週共備。', pilot: '共備改成自願試辦，有一群老師願意先走。', failed: '共備提案沒有通過，你需要重新累積信任。', absent: '你缺席了自己的提案會議，提案擱置。' }[P] || '共備提案尚無結果。';
  const ppl = ['wang', 'huang', 'hsu', 'lin', 'limom', 'xiaoyu'].map(k => `${NPC[k].name} ${S.trust[k]}`).join('、');
  openModal(`<h1>第一階段試玩完成</h1><p class="mut">青禾國小・開學第一週</p>
    <canvas id="radar" width="360" height="300" style="display:block;margin:0 auto"></canvas>
    <div class="card"><b>學校現況</b><br>${pText}<br>經費剩下 ${S.stats.b} 萬。<br><span class="mut">關鍵人物的信任：${ppl}</span></div>
    <h3>你的領導風格</h3>${tm ? `<p>兩天下來，你最常用的是 <b style="color:var(--gold)">${GEN.MODES[tm.m].label}</b>。分布：${tm.order.map(m => GEN.MODES[m].label + ' ' + tm.cnt[m]).join('、')}</p>${theoryHTML(tm.arch)}` : '<p class="mut">尚無資料</p>'}
    <h3>課堂討論題</h3><div class="card">1. 你在哪個時刻最強烈感受到「時間不夠」？你放下的是誰？<br>2. 王老師的信任是怎麼升高（或降低）的？如果重來一次，你會先做什麼？<br>3. 校務會議的投票結果，有多少是在會議之前就決定了？</div>
    <p class="mut">第 3–10 天（班親會、公開觀課、颱風、運動會、經費核銷、霸凌通報、校務評鑑、期末規劃）製作中。</p>
    <div class="row"><button class="btn gold" id="again">重新開始</button></div>`);
  drawRadar();
  $('again').onclick = () => { localStorage.removeItem(SAVE_KEY); S = newState(); startDay(0); };
}
function drawRadar() {
  const c = $('radar').getContext('2d'), cx = 180, cy = 150, R = 105;
  const ax = [['m', '教師士氣'], ['l', '學生學習'], ['p', '家長信任'], ['a', '行政效能']];
  c.font = '14px "PingFang TC",sans-serif'; c.textAlign = 'center';
  for (let lv = 1; lv <= 4; lv++) { c.beginPath(); ax.forEach((_, i) => { const an = -Math.PI / 2 + i * Math.PI * 2 / ax.length, r = R * lv / 4; c[i ? 'lineTo' : 'moveTo'](cx + Math.cos(an) * r, cy + Math.sin(an) * r); }); c.closePath(); c.strokeStyle = '#4a5070'; c.stroke(); }
  c.beginPath(); ax.forEach(([k], i) => { const an = -Math.PI / 2 + i * Math.PI * 2 / ax.length, r = R * S.stats[k] / 100; c[i ? 'lineTo' : 'moveTo'](cx + Math.cos(an) * r, cy + Math.sin(an) * r); }); c.closePath();
  c.fillStyle = '#ffd16655'; c.fill(); c.strokeStyle = '#ffd166'; c.lineWidth = 2; c.stroke();
  ax.forEach(([k, l], i) => { const an = -Math.PI / 2 + i * Math.PI * 2 / ax.length; c.fillStyle = '#f3ecd8'; c.fillText(`${l} ${S.stats[k]}`, cx + Math.cos(an) * (R + 26), cy + Math.sin(an) * (R + 22) + 5); });
}

/* ============ 標題、說明、人物 ============ */
function helpHTML() {
  return `<h3>操作</h3>方向鍵／WASD：走路　空白鍵／Enter：對話、確認　數字鍵 1–5：選選項　T：等 15 分鐘
  <h3>規則</h3>・時間從 07:30 跑到 16:30，<b>時鐘會一直走</b>（對話時暫停），處理事情也要花時間，<b>一天做不完所有事</b>。<br>
  ・待辦清單只會告訴你事情「幾點開始」，不會告訴你對方能等多久（重要行程除外）。<br>
  ・頭上有 <b style="color:#ff6b6b">!</b> 的人正在找你，<b style="color:var(--gold)">★</b> 是重要行程，<b>…</b> 代表等等會有事。超過時間沒處理就算錯過，會有後果。<br>
  ・體力不夠時，有些選項會不能選；吃午餐、在辦公桌休息可以回復。<br>
  ・每個人對你的信任會累積。信任不夠時，有些做法會被打折扣甚至反效果。<br>
  ・你今天的決定，會影響之後幾天發生的事。<br>
  ・每個選擇背後都對應一種領導風格，每天結束時揭曉。`;
}
function showTitle() {
  mode = 'title';
  const sv = load();
  const img = sprite('principal', 'm', NPC.principal.pal).toDataURL();
  openModal(`<div style="text-align:center"><img src="${img}" style="width:96px;image-rendering:pixelated"><h1>校長的一天</h1><p class="mut">青禾國小・第一學期</p></div>
    <p>你是青禾國小新上任的校長。學校有 24 班、600 個孩子、50 位教職員。少子化、家長高度關注、新課綱推動、資深老師倦怠……每一天都有做不完的事。</p>
    <p>你要在 10 個學期關鍵日裡，好好經營這所學校。<span class="mut">（目前開放第 1、2 天試玩）</span></p>
    <div class="card">${helpHTML()}</div>
    <div class="row">${sv && sv.dayStart ? `<button class="btn gold" id="cont">繼續：${(sv.nextDay ?? sv.day) >= DAYS.length ? '看總結' : '第 ' + ((sv.nextDay ?? sv.day) + 1) + ' 天' + (sv.nextDay == null ? '（從 07:30 重新開始）' : '')}</button>` : ''}<button class="btn ${sv && sv.dayStart ? '' : 'gold'}" id="newg">開始新遊戲</button></div>
    <p class="mut" style="font-size:12px">學校與人物皆為虛構。理論引用取自本系列 v2 查證過的文獻白名單。</p>`);
  if ($('cont')) $('cont').onclick = () => { S = Object.assign(newState(), sv); closeModal(); const nd = S.nextDay ?? S.day; if (nd >= DAYS.length) showFinal(); else startDay(nd, S.nextDay != null); };
  $('newg').onclick = () => { S = newState(); closeModal(); startDay(0); };
}
function showPeople() {
  if (!S || mode !== 'play') return;
  mode = 'modal';
  const lv = v => GEN.LEVELS.find(L => v >= L.min && v <= L.max) || GEN.LEVELS[0];
  const h = Object.keys(NPC).filter(k => k !== 'principal' && S.trust[k] != null).map(k => {
    const n = NPC[k], v = S.trust[k], L = lv(v);
    return `<div class="ppl"><img src="${npcSprite(k).toDataURL()}" alt=""><div style="flex:1"><b>${n.name}</b> <span class="mut">${n.role}</span><br><span style="font-size:13px">${n.blurb}</span>
      <div class="stat" style="max-width:260px"><span>信任 ${v}（<span style="color:${L.color}">${L.label}</span>）</span><div class="bar"><i style="width:${v}%;background:${L.color}"></i></div></div></div></div>`;
  }).join('');
  openModal(`<h2>👥 青禾國小的人們</h2>${h}<div class="row"><button class="btn gold" id="cl">關閉</button></div>`);
  $('cl').onclick = () => { closeModal(); mode = 'play'; };
}

/* ============ 輸入 ============ */
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (mode === 'modal' || mode === 'title' || mode === 'summary') return;  // 交給按鈕原生的 Enter／空白鍵
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (mode === 'dialog' && /^[1-9]$/.test(k)) { const b = $('dChoices').querySelectorAll('button')[+k - 1]; if (b && !b.disabled) b.click(); return; }
  if (k === ' ' || k === 'Enter') { if (!e.repeat) interact(); return; }
  if (k === 't' && mode === 'play') return waitAWhile();
  keys[k] = true;
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#pad [data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
});
$('bA').onclick = interact;
$('bWait').onclick = waitAWhile;
$('bPeople').onclick = showPeople;
$('bHelp').onclick = () => { if (mode !== 'play') return; mode = 'modal'; openModal(`<h2>❔ 遊戲說明</h2>${helpHTML()}<div class="row"><button class="btn gold" id="cl">關閉</button></div>`); $('cl').onclick = () => { closeModal(); mode = 'play'; }; };

/* ============ 主迴圈 ============ */
buildMap();
let lastT = performance.now(), hudT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (S) update(dt);
  draw(t); drawMini(t);
  hudT += dt; if (hudT > 1 && S) { hudT = 0; renderHUD(); }
  requestAnimationFrame(loop);
}
player.x = 20 * T; player.y = 15 * T;
renderHUD(); showTitle();
requestAnimationFrame(loop);
</script>
</body>
</html>
