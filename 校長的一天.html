<!--

  - 單一 HTML、零後端、不需金鑰；進度存在瀏覽器 localStorage

<style>
:root{--bg:#1b1d2a;--panel:#262a3d;--line:#0d0e15;--ink:#f3ecd8;--mut:#a9a39a;--gold:#ffd166;--red:#ef6f6c;--green:#7bd389;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}
#app{max-width:1260px;margin:0 auto;padding:10px;}
#hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #3c4260;padding:8px 10px;margin-bottom:8px;}
#hud .day{font-weight:700;color:var(--gold);min-width:210px}
#hud .clock{font-family:monospace;font-size:22px;background:#111;padding:2px 10px;border:2px solid #000;color:#9ff0b0;letter-spacing:1px}
.stat{display:flex;flex-direction:column;font-size:12px;min-width:92px}
.stat .bar{height:9px;background:#111;border:2px solid #000;margin-top:2px}
.stat .bar i{display:block;height:100%}
#main{display:flex;gap:8px;align-items:flex-start}
#stage{position:relative;flex:1;border:3px solid var(--line);background:#000;line-height:0}
#cv{width:100%;height:auto;image-rendering:pixelated;display:block}
#side{width:270px;background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px #3c4260;padding:8px;font-size:13px}
#side h3{margin:4px 0 6px;font-size:14px;color:var(--gold)}
#todo div{padding:4px 2px;border-bottom:1px dashed #444a66;line-height:1.35}
#todo .done{color:#7f8a7f;text-decoration:line-through}
#todo .missed{color:#a86a68}
#todo .act{color:#fff;font-weight:700}
#mini{width:100%;image-rendering:pixelated;border:2px solid #000;margin-top:2px}
.btn{background:#3d4566;color:var(--ink);border:2px solid #000;box-shadow:inset -2px -2px 0 #2a3048,inset 2px 2px 0 #59628a;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{background:#4c5680}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:#b8862b;box-shadow:inset -2px -2px 0 #7d5a1a,inset 2px 2px 0 #e0b04e}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#dlg{position:absolute;left:2%;right:2%;bottom:3%;display:flex;gap:12px;background:#f3ecd8;color:#2a2622;border:4px solid #1a1612;box-shadow:0 0 0 4px #f3ecd8,0 0 0 8px #1a1612;padding:12px;line-height:1.6;font-size:15px;max-height:78%;overflow:auto}
#dlg[hidden]{display:none}
#dPt{flex:0 0 84px;text-align:center}
#dPt img{width:84px;height:84px;image-rendering:pixelated;background:#d8cdb2;border:3px solid #1a1612}
#dPt .emo{display:block;width:84px;height:84px;line-height:84px;font-size:44px;background:#d8cdb2;border:3px solid #1a1612}
#dName{font-weight:700;color:#7a3b1f;margin-bottom:2px}
#dText{white-space:pre-wrap}
#dFx{margin-top:6px;font-size:13px;color:#3a5a3a;font-weight:700}
#dChoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ch{text-align:left;background:#fffaf0;border:3px solid #1a1612;padding:7px 10px;cursor:pointer;font:inherit;font-size:14px;color:#2a2622}
.ch:hover{background:#ffe9b8}
.ch:disabled{opacity:.45;cursor:not-allowed}
.ch .k{display:inline-block;background:#1a1612;color:#f3ecd8;padding:0 6px;margin-right:6px;font-family:monospace}
.ch .sub{display:block;font-size:12px;color:#7a6f60;margin-top:2px}
#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;line-height:1.4;width:90%}
.tst{background:#1a1612ee;border:2px solid #f3ecd8;padding:6px 12px;font-size:14px;max-width:100%;transition:opacity .5s}
.tst.warn{border-color:var(--gold);color:var(--gold)}
.tst.bad{border-color:var(--red);color:#ffd0ce}
.tst.good{border-color:var(--green);color:#d6ffde}

#modal[hidden]{display:none}
#mbox{background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 3px #3c4260;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px 24px;line-height:1.7}

#mbox h2{color:var(--gold);margin:0 0 8px}
#mbox h3{color:var(--gold);margin:14px 0 4px;font-size:16px}
.mut{color:var(--mut)}
.card{background:#1e2233;border:2px solid #000;padding:10px 12px;margin:8px 0}
.quote{border-left:4px solid var(--gold);padding:4px 10px;margin:6px 0;background:#1e2233}
.cite{font-size:12px;color:var(--mut);white-space:pre-wrap}
table.lg{width:100%;border-collapse:collapse;font-size:13px}
table.lg td{border-bottom:1px solid #3c4260;padding:4px;vertical-align:top}
.pos{color:var(--green)}.neg{color:var(--red)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border:1px solid #888;margin-left:4px;color:#ddd}
#pad{display:none;margin-top:8px;gap:8px;justify-content:space-between;align-items:center}
#pad .dp{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
#pad button{font-size:20px}
@media (max-width:980px){#main{flex-direction:column}#side{width:100%}#pad{display:flex}}

.ppl{display:flex;gap:10px;align-items:center;border-bottom:1px solid #3c4260;padding:6px 0}
.ppl img{width:48px;height:48px;image-rendering:pixelated;background:#1e2233;border:2px solid #000}
</style>
</head>

<script>
/* ============ GEN：抽自 v2 leadership_modes.py（MODES／THEORY／LEVELS），請勿手改引用 ============ */
const GEN = {"MODES": {"bureaucratic": {"label": "科層模式", "subtitle": "依法行政、層級節制、正式程序"}, "servant": {"label": "僕人領導", "subtitle": "傾聽、成全、以人的成長為先"}, "system": {"label": "系統領導", "subtitle": "跨界協作、共善共好、系統思維"}, "distributed": {"label": "分散式領導", "subtitle": "領導不由階層決定，而由任務與專長決定"}, "middle": {"label": "中層領導", "subtitle": "承上啟下、居間協調、以關係信任撬動改變"}, "teacher": {"label": "教師領導", "subtitle": "非正式權威、以同儕關係與專業影響力帶動改變"}}, "THEORY": {"bureaucratic.directive": {"key": "weber_rules", "quote": "Weber（1947）指出，理性—法定型權威的科層組織依賴明確成文的規則與程序運作，決策不因人設事，而是依循既定規範一體適用。", "cite": "Weber, M. (1947). The theory of social and economic organization (A. M. Henderson & T. Parsons, Trans.). Free Press."}, "bureaucratic.formal_meeting": {"key": "weber_hierarchy", "quote": "Weber（1947）描述的科層體制核心特徵之一，是清楚的權威層級與職權分工——每個職位有明確的職責範圍，決策依層級逐級確認。", "cite": "Weber, M. (1947). The theory of social and economic organization (A. M. Henderson & T. Parsons, Trans.). Free Press."}, "bureaucratic.escalate": {"key": "bolman_structural", "quote": "Bolman 與 Deal（2017）在組織的四重框架理論中，將「結構框架」定義為透過正式角色、規則與層級權威來達成組織目標的治理方式。", "cite": "Bolman, L. G., & Deal, T. E. (2017). Reframing organizations: Artistry, choice, and leadership (6th ed.). Jossey-Bass."}, "servant.listen": {"key": "greenleaf_listen", "quote": "Greenleaf（1977）提出僕人領導的核心命題：真正的領導始於「先有服務他人的渴望」，而非先有領導他人的企圖。", "cite": "Greenleaf, R. K. (1977). Servant leadership: A journey into the nature of legitimate power and greatness. Paulist Press."}, "servant.remove_obstacle": {"key": "greenleaf_steward", "quote": "Greenleaf（1977）提出檢驗僕人領導成效的著名標準：「被服務的人是否因此成長？他們在被服務的過程中，是否變得更健康、更有智慧、更自由、更能自主，也更可能成為服務他人的人？」主動移除對方推動政策時面臨的實際障礙，正是這種「管家精神」（stewardship）的具體展現——資源與權限用來成全他人，而非鞏固領導者自身的地位。", "cite": "Greenleaf, R. K. (1977). Servant leadership: A journey into the nature of legitimate power and greatness. Paulist Press."}, "servant.empower": {"key": "spears_growth", "quote": "Spears（1998）整理 Greenleaf 的思想，歸納出僕人領導者的十大特質，其中「對他人成長的承諾」（commitment to the growth of people）強調領導者相信每個人都有超越目前職責之外的內在價值，並主動創造條件讓對方能發展、能主導。", "cite": "Spears, L. C. (Ed.). (1998). Insights on leadership: Service, stewardship, spirit, and servant-leadership. John Wiley & Sons."}, "system.guiding": {"key": "sys_guiding", "quote": "Hopkins（2007）指出，系統領導者的角色之一是「示範者」——透過分享自己單位的成功實踐，協助夥伴建立能力。", "cite": "Hopkins, D. (2007). Every school a great school. McGraw-Hill.\nFullan, M. (2005). Systems thinkers in action. DfES."}, "system.collab": {"key": "sys_collab", "quote": "Hargreaves（2012）認為，成熟的自我改善系統需要建立「夥伴關係能力」：領導者必須主動建構組織與個人的網絡連結、建立彼此自發性的共同目標，並設計相互評估的機制。", "cite": "Hargreaves, D. H. (2012). A self-improving school system: towards maturity. National College for School Leadership."}, "system.empowering": {"key": "sys_empowering", "quote": "Hopkins（2007）強調，系統領導者最核心的特質是具備「道德目的」（moral purpose）——不只關心自己單位的表現，更致力於讓整個系統更好。", "cite": "Hopkins, D. (2007). Every school a great school. McGraw-Hill.\nHarris, A., Jones, M., & Hashim, N. (2021). System leaders and system leadership. School Leadership & Management, 41(4-5), 387-408."}, "distributed.directive": {"key": "dist_directive", "quote": "Timperley（2005）指出，傳統領導研究長期以「英雄式領導者」為預設，認為成敗繫於一位具有例外能力的領導者。", "cite": "Timperley, H. S. (2005). Distributed leadership: developing theory from practice. Journal of Curriculum Studies, 37(4), 395-420."}, "distributed.dialogic": {"key": "dist_dialogic", "quote": "Spillane、Halverson 與 Diamond（2004）主張，領導實踐不是個人特質或行為，而是領導者在特定脈絡中與他人互動所產生的活動——是「在情境中行動的行動者」所建構的過程。", "cite": "Spillane, J. P., Halverson, R., & Diamond, J. B. (2004). Towards a theory of leadership practice: A distributed perspective. Journal of Curriculum Studies, 36(1), 3-34."}, "distributed.empowering": {"key": "dist_empowering", "quote": "Timperley（2005）引用 Copland（2003）的定義：「誰領導、誰跟隨，由任務或問題情境決定，而不是由一個人在階層中的位置決定。", "cite": "Timperley, H. S. (2005). Distributed leadership: developing theory from practice. Journal of Curriculum Studies, 37(4), 395-420.\nCopland, M. A. (2003). Leadership of inquiry. Educational Evaluation and Policy Analysis, 25(4), 375-395."}, "middle.bridge": {"key": "middle_bridge", "quote": "De Nobile（2017）提出中層領導的理論模型，指出中層領導者同時扮演「橋接者」的角色——一方面把校務政策轉譯成教師能理解、能執行的具體做法，另一方面把教師的處境與心聲帶回給校長與行政團隊。", "cite": "De Nobile, J. (2017). Towards a theoretical model of middle leadership in schools. School Leadership & Management. https://doi.org/10.1080/13632434.2017.1411902"}, "middle.secure_conditions": {"key": "middle_conditions", "quote": "Bryant（2018）以香港學校為案例，指出中層領導者要能發揮組織與系統層次的領導力，需要一系列結構條件的支持——包括正式的授權、足夠的時間，以及來自校長的明確信任與後盾。", "cite": "Bryant, D. A. (2018). Conditions that support middle leaders' work in organisational and system leadership: Hong Kong case studies. School Leadership & Management. https://doi.org/10.1080/13632434.2018.1489790"}, "middle.peer_inquiry": {"key": "middle_trust", "quote": "Edwards-Groves、Grootenboer 與 Rönnerman（2016）的研究指出，校本行動研究是建立「關係信任」（relational trust）的重要場域，而中層領導者在其中扮演關鍵的促成角色。", "cite": "Edwards-Groves, C., Grootenboer, P., & Rönnerman, K. (2016). Facilitating a culture of relational trust in school-based action research: Recognising the role of middle leaders. Educational Action Research. https://doi.org/10.1080/09650792.2015.1131175"}, "teacher.build_collegial": {"key": "teacher_collegial", "quote": "Hairon、Goh 與 Chua（2015）以民族誌案例研究分析教師領導如何支持專業學習社群（PLC）的對話，歸納出教師領導展現的三個構面，其中第一個構面是「建立同儕與協作關係」（building collegial and collaborative relations）。", "cite": "Hairon, S., Goh, J. W. P., & Chua, C. S. K. (2015). Teacher leadership enactment in professional learning community contexts: Towards a better understanding of the phenomenon. School Leadership & Management, 35(2), 163-182."}, "teacher.promote_learning": {"key": "teacher_learning", "quote": "Hairon、Goh 與 Chua（2015）指出的第二個教師領導構面，是「促進教師學習與專業發展」（promoting teacher learning and development）。", "cite": "Hairon, S., Goh, J. W. P., & Chua, C. S. K. (2015). Teacher leadership enactment in professional learning community contexts: Towards a better understanding of the phenomenon. School Leadership & Management, 35(2), 163-182."}, "teacher.drive_practice_change": {"key": "teacher_practice", "quote": "Hairon、Goh 與 Chua（2015）提出的第三個教師領導構面，是「促成教學實踐的改變」（enabling change in teaching practice）——教師領導者最終要能帶動同儕實際在課堂中嘗試新做法，而不只停留在關係經營與知識分享。", "cite": "Hairon, S., Goh, J. W. P., & Chua, C. S. K. (2015). Teacher leadership enactment in professional learning community contexts: Towards a better understanding of the phenomenon. School Leadership & Management, 35(2), 163-182.\n陳佩英（2008）。教師領導之興起與發展。教育研究月刊，171，41。"}}, "LEVELS": [{"min": 0, "max": 20, "label": "抗拒", "color": "#e53e3e"}, {"min": 21, "max": 40, "label": "觀望", "color": "#dd6b20"}, {"min": 41, "max": 60, "label": "中立", "color": "#d69e2e"}, {"min": 61, "max": 80, "label": "支持", "color": "#38a169"}, {"min": 81, "max": 100, "label": "系統夥伴", "color": "#276749"}]};

/* ============ 基本常數 ============ */
const T = 48, PX = 3;                 // 一格 48px（16 像素 ×3）

const costOf = c => c ? Math.max(5, Math.round(c * COST_MULT / 5) * 5) : 0;              // 現實 0.6 秒＝遊戲 1 分鐘（一天全程閒置約 5.4 分鐘）
const SAVE_KEY = 'qinghe_principal_day_v6';
const STAT = { m: '教師士氣', l: '學生學習', p: '家長信任', a: '行政效能', b: '經費', e: '體力' };
const STAT_COLOR = { m: '#f4a259', l: '#5bc0eb', p: '#f25f5c', a: '#9bc53d', b: '#ffd166', e: '#c792ea' };
const $ = id => document.getElementById(id);
const fmt = t => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');

const val = x => typeof x === 'function' ? x(S) : x;

/* ============ 人物（皆為虛構） ============ */

        { text: '「請收齊觀課紀錄表，歸入教學檔案。」', th: 'bureaucratic.formal_meeting', cost: 10, eff: { a: 3, m: -3 }, trust: { lin: 1 }, flags: ['obs_scored'],
          reply: '林主任點頭，但你注意到她停了一下：「老師們會覺得這是在評鑑他們。」' },
        { text: '「請老師互相觀課，校長只看自己想看的三班。」', th: 'distributed.empowering', cost: 5, eff: { m: 1, e: 2 }, flags: ['peer_obs'],
          reply: '林主任：「好，我把大家的觀課搭檔排出來。」' },
      ],
      miss: { trust: { lin: -3 }, log: '林主任沒等到你的決定，觀課表只好按去年的格式印。' } },

    { id: 'd4_chen', npc: 'chen', pos: [14, 22], start: 495, end: 570, title: '操場上的衝突', loc: '操場',
      text: '陳主任：「校長，六年級的小凱和另一位同學在操場打起來了，都擦傷了。小凱最近老是這樣，班上幾個同學也都跟著他。王老師說他在班上很會控制氣氛，但沒人敢跟他槓。」',
      choices: [
        { text: '請兩位同學分開晤談，先處理傷勢，再了解經過', th: 'servant.listen', cost: 25, eff: { e: -6, l: 1 }, trust: { chen: 3, wu: 2 }, flags: ['kai_seen', 'kai_talked'],
          reply: '小凱一開始什麼都不說。陳主任後來悄悄跟你講：「他爸媽去年分居，他最近特別暴躁。」' },
        { text: '依校規處理：記警告，通知家長到校說明', th: 'bureaucratic.directive', cost: 15, eff: { a: 3, p: -2 }, trust: { chen: 3 }, flags: ['kai_seen', 'kai_warned'],
          reply: '小凱被記了警告。他走出學務處時瞪了另一位同學一眼，這件事沒有結束。' },
        { text: '把這件事交給陳主任和導師處理，校長只聽最後結果', th: 'distributed.empowering', cost: 5, eff: { a: 2 }, trust: { chen: 2 }, flags: ['kai_seen'],
          reply: '陳主任：「好，我會處理。」你什麼都沒問，但這件事你已經看到了。' },
      ],
      miss: { eff: { l: -2 }, flags: ['kai_seen'], log: '操場的衝突沒有人處理，下課後小凱的班上氣氛怪怪的。' } },

    { id: 'd4_hsu', npc: 'hsu', start: 540, end: 605, title: '許老師的公開課', loc: '一年級教室',
      text: S => '許老師站在教室前面，雙手有點發抖：「校、校長，我今天要教《注音符號》…」'
        + (S.flags.wang_mentor ? '\n（王老師已經坐在教室後方。他對你點點頭，在紙上寫著什麼。）' : ''),
      choices: [
        { text: '坐在後面，不寫字，只看孩子在做什麼、說什麼', th: 'servant.listen', cost: 25, eff: { e: -5, m: 2, l: 2 }, trust: { hsu: 6 },
          reply: '課後你說：「第三排那個小男生，今天第一次舉手。」許老師眼眶紅了：「我都沒注意到。」' },
        { text: '邊看邊記優缺點，課後直接給建議', th: 'bureaucratic.directive', cost: 25, eff: { e: -5, a: 1, l: 1 }, trust: { hsu: -3 },
          reply: '你列了五點建議，都很實際。許老師一直點頭，但後來你看到她把筆記本蓋起來。' },
        { text: '邀王老師或另一位資深老師一起看，下課三人一起聊', th: 'middle.peer_inquiry', cost: 35, eff: { e: -6, m: 3, l: 2 }, trust: { hsu: 7, wang: 2 },
          reply: '三人聊了 20 分鐘。王老師說：「年輕老師有一個很棒的地方：她是真的在看孩子。」許老師聽了差點哭出來。' },
      ],
      miss: { eff: { m: -2 }, trust: { hsu: -5 }, log: '許老師的公開課，校長沒有出現。' } },

    { id: 'd4_zhang', npc: 'zhang', start: 520, end: 590, title: '網路中斷', loc: '總務處',
      text: '張主任：「校長，三年級今天要用平板上數學課，但無線基地台壞了，整個中棟都沒網路。換新的要 3 萬，如果只是修，大概一週。」',
      choices: S => [
        { text: '買 2 台新的基地台，馬上換', th: 'servant.remove_obstacle', cost: 10, eff: { b: -3, l: 1, m: 2 }, trust: { zhang: -2 },
          reply: '張主任一邊簽單一邊搖頭：「經費真的越來越吃緊。」基地台中午前就裝好了。' },
        { text: '請黃老師改用紙本備案，等維修', th: 'distributed.directive', cost: 5, eff: { m: -1 }, trust: { zhang: 3, huang: -3 },
          reply: '張主任：「這樣最省。」黃老師的表情，大概是不太開心。' },
        { text: '請資訊組長帶幾位學生資訊小幫手先修，不行再買', th: 'distributed.empowering', cost: 15, eff: { e: -2, m: 1 }, trust: { zhang: 1 },
          reply: '資訊組長帶著三個五年級學生，花一小時修好了其中一台。剩下的下週再說。' },
      ],
      miss: { eff: { l: -2, m: -2 }, log: '公開課網路中斷，黃老師的平板課只好臨時改成紙本。' } },

    { id: 'd4_huang', npc: 'huang', start: 565, end: 640, title: '黃老師的課', loc: '三年級教室',
      text: S => '黃老師的課大家都說好，學生分組討論，氣氛熱烈。下課時他走過來，把觀課單放在桌上：'
        + (S.flags.obs_scored ? '「校長，這張單子，是要拿來評我們嗎？」' : S.flags.obs_no_score ? '「謝謝你說不評分。老師不是不願意被看，是不想被打分數。」' : '「校長，我們不是怕被看，而是怕被拿來比。」'),
      choices: [
        { text: '請他在議課時分享他的分組設計，大家一起學', th: 'teacher.drive_practice_change', cost: 15, eff: { e: -3, m: 3, l: 2 }, trust: { huang: 6 }, flags: ['huang_shares'],
          reply: '黃老師笑了：「如果是分享，我願意。如果是示範，我不要。」你點頭：「分享。」' },
        { text: '「我看到你的學生很投入，可否請你說說，你是怎麼讓他們開口的？」', th: 'servant.listen', cost: 20, eff: { e: -4, m: 2, l: 1 }, trust: { huang: 5 },
          reply: '黃老師聊起他怎麼設計問題：「我最怕的是學生只是照著課本唸。」你學到了不少。' },
        { text: '依慣例填寫觀課單，課後交給教務處存檔', th: 'bureaucratic.formal_meeting', cost: 10, eff: { a: 2, m: -2 }, trust: { huang: -4 },
          reply: '黃老師看著你填單，沒說什麼。你知道他不喜歡這種被分類的感覺。' },
      ],
      miss: { eff: { m: -2 }, trust: { huang: -4 }, log: '黃老師的公開課，校長沒到。他在教師會群組說：「說要看課，結果人都不來。」' } },

    { id: 'd4_wang', npc: 'wang', start: 610, end: 685, title: '王老師的課', loc: '六年級教室',
      text: S => S.flags.wang_leads_group
        ? '王老師的閱讀討論課，孩子們輪流當主持人，氣氛很活。小宇坐在最後一排，沒有舉手，但在筆記本上畫了很多東西。'
        : S.flags.wang_forced
          ? '王老師照著課本唸，孩子們低頭抄寫。他看到你坐在後面，一整節課沒有看你一眼。'
          : '王老師的課很穩，孩子們很守規矩，但也沒什麼人舉手。小宇坐在最後一排，一直低著頭。',
      choices: [
        { text: '課後肯定他的提問設計，邀他在議課分享', th: 'teacher.promote_learning', cost: 20, eff: { e: -4, m: 2, l: 2 }, trust: { wang: 5 },
          reply: '王老師愣了一下，語氣緩和：「分享？……我考慮一下。」' },
        { text: '課後輕聲提到：「小宇這節沒開口，他在班上好像沒有朋友？」', th: 'middle.bridge', gate: ['wang', 45], cost: 15, eff: { e: -3 }, trust: { wang: 3, wu: 2 }, flags: ['xiaoyu_noticed'],
          reply: '王老師沉默了一下：「這孩子上學期被欺負過，我一直盯著。」他其實有在注意。',
          low: { eff: { e: -3, m: -1 }, trust: { wang: -4 }, flags: ['xiaoyu_noticed'], reply: '王老師立刻回：「校長是說我沒盡責？」氣氛變得很僵。但你確實把這件事放進了心裡。' } },
        { text: '照例寫觀課紀錄，下週交給教務處', th: 'bureaucratic.formal_meeting', cost: 10, eff: { a: 2 }, trust: { wang: -1 },
          reply: '王老師看你寫了很久，也沒有多問。' },
      ],
      miss: { trust: { wang: -4 }, log: '王老師的課，校長沒來。' } },

    { id: 'd4_xiaoyu', npc: 'xiaoyu', pos: [8, 23], start: 650, end: 705, title: '操場邊的小宇', loc: '操場',
      text: S => S.flags.xiaoyu_talk
        ? '小宇主動走過來，把一張被撕破的畫遞給你：「班上的人還是會拿我的東西。」'
        : S.flags.xiaoyu_counsel
          ? '小宇坐在階梯上。吳主任說他晤談了兩次，但還不願多說。他看到你，輕輕點了頭。'
          : '你在操場邊看到小宇一個人坐在階梯上，手上的作業簿被人塗掉了名字。',
      choices: [
        { text: '蹲下來聽他說，並告訴他：「這不是你的錯，你不用一個人撐。」', th: 'servant.listen', cost: 25, eff: { e: -6 }, trust: { xiaoyu: 12 }, flags: ['bully_logged'],
          reply: '小宇小聲說：「那個人叫小凱。」他說完，眼睛看向地上。你把這件事寫進口袋筆記，沒有立刻去質問誰。' },
        { text: '帶他去找輔導室，請吳主任與導師一起密切觀察', th: 'middle.bridge', cost: 15, eff: { e: -3 }, trust: { xiaoyu: 5, wu: 3, wang: 2 }, flags: ['bully_watch'],
          reply: '吳主任和王老師約好每天課間注意他。小宇回頭看你，嘴角動了一下。' },
        { text: '立刻請王老師處理，找帶頭的同學來問話', th: 'bureaucratic.directive', cost: 10, eff: { a: 1 }, trust: { xiaoyu: -5, wang: -2 }, flags: ['bully_teacher_handles'],
          reply: '王老師當天就找人問話，下課後小宇看起來更沉默了。' },
      ],
      miss: { eff: { l: -2 }, trust: { xiaoyu: -6 }, flags: ['xiaoyu_ignored'], log: '操場邊的小宇一直一個人坐著，直到鐘響。' } },

    { id: 'd4_lunch', npc: 'azhu', start: 720, end: 790, title: '午餐時間', loc: '廚房',
      text: '阿珠姨：「校長，今天的湯多煮了一鍋，老師們都說好喝。你要不要坐下來吃？」',
      choices: [
        { text: '邀不同年級的老師同桌吃，邊吃邊聊今天的課', th: 'teacher.build_collegial', cost: 40, eff: { e: 8, m: 3 }, trust: { azhu: 3, huang: 2, wang: 2 },
          reply: '不同年級的老師第一次坐在一桌，聊起各自的班級。一年級老師說：「原來六年級的孩子也這樣。」' },
        { text: '在廚房快速吃完，回去準備議課', th: null, cost: 20, eff: { e: 15 }, flags: ['yi_prepared'],
          reply: '你一邊吃飯一邊把觀課筆記整理成三個重點，下午議課會比較有條理。' },
        { text: '到廚房和阿珠姨對對菜單與份量，確認明天的菜', th: 'servant.remove_obstacle', cost: 20, eff: { e: 10, p: 1 }, trust: { azhu: 4 },
          reply: '阿珠姨很開心：「校長願意聽我們的意見，我們煮得更有勁。」' },
      ],
      miss: { eff: { e: -10 }, log: '你又沒吃午餐，下午議課有點恍神。' } },

    { id: 'd4_wu', npc: 'wu', start: 560, end: 635, title: '觀課時發現的孩子', loc: '輔導室',
      text: '吳主任：「校長，今天觀課有三位老師私下跟我說，班上各有一位孩子可能需要特殊教育評估：專注、閱讀、情緒上都有狀況。轉介要家長同意，流程也要幾個月。我想請問校長的意見。」',
      choices: [
        { text: '「依流程啟動轉介，我會親自出席和家長說明，讓他們知道這是支持。」', th: 'middle.secure_conditions', cost: 35, eff: { e: -7, l: 3, a: 2 }, trust: { wu: 6 }, flags: ['sped_referral'],
          reply: '吳主任鬆了口氣：「有校長一起，家長比較不會覺得被貼標籤。」' },
        { text: '請吳主任和老師先與家長非正式溝通，視反應再決定', th: 'distributed.empowering', cost: 20, eff: { e: -3, l: 1 }, trust: { wu: 3 },
          reply: '吳主任：「好，慢慢來。」不過你知道，轉介拖得越久，孩子的困難越深。' },
        { text: '「先觀察一個學期，等老師累積更多紀錄再說。」', th: 'bureaucratic.directive', cost: 5, eff: { a: 1, l: -3 }, trust: { wu: -4 },
          reply: '吳主任點頭，但你看到她把筆記本蓋上時，手停了一下。' },
      ],
      miss: { eff: { l: -3 }, trust: { wu: -4 }, log: '觀課時發現的孩子沒有人處理，轉介一再延後。' } },

    { id: 'd4_zhou', npc: 'zhou', pos: [6, 9], start: 620, end: 700, title: '家長想來觀課', loc: '校長室門口',
      text: '周會長：「校長，有 15 位家長想來看公開授課，我已經幫他們報名了。他們也想拍照發在家長群組，讓更多家長看到學校的努力，可以嗎？」',
      choices: [
        { text: '家長可以觀課，但需簽到、不能拍攝學生，並由行政人員帶領分梯次入班', th: 'bureaucratic.directive', cost: 15, eff: { a: 3, p: -1 }, trust: { zhou: -2 }, flags: ['parents_observe_rules'],
          reply: '周會長：「規矩我懂，我跟大家說。」不過他看起來有點掃興。' },
        { text: '邀家長先參加 10 分鐘導覽，說明觀課禮儀，再和老師一起議課', th: 'system.collab', cost: 30, eff: { e: -6, p: 4, m: 1 }, trust: { zhou: 5 }, flags: ['parents_observe_rules'],
          reply: '家長們聽完導覽，觀課時都很安靜。有位爸爸離開時說：「原來老師是這樣教孩子的。」' },
        { text: '「好，歡迎家長來，拍照發群組也沒問題。」', th: null, cost: 5, eff: { p: 2, a: -3 }, trust: { zhou: 6 }, flags: ['photos_posted'],
          reply: '周會長很開心。但下午有位家長傳訊息抗議：「為什麼我的孩子出現在群組照片裡？」' },
      ],
      miss: { eff: { p: -2 }, trust: { zhou: -4 }, log: '家長觀課沒有人安排，15 位家長在走廊上走來走去。' } },

    { id: 'd4_yi', npc: 'lin', pos: [36, 13], start: 840, end: 930, main: true, title: '議課', loc: '會議室', label: '議課｜旁白',
      nodes: {
        start: {
          text: S => {
            const mood = S.flags.obs_scored ? '大家手上拿著觀課紀錄表，氣氛有點拘謹。' : S.flags.obs_no_score ? '大家手上沒有表格，只有各自的筆記本，氣氛比較放鬆。' : '氣氛平平，還在觀望。';
            return '14:00，會議室。今天公開授課的老師和觀課的老師都到了。' + mood + '\n\n黃老師、王老師、許老師各坐一角。林主任看著你，等你開場。\n\n議課要怎麼進行？';
          },
          choices: [
            { text: '請授課老師先說：「我想讓大家看見什麼？」其他人再回應', th: 'teacher.promote_learning', cost: 40,
              fx: S => { const g = S.flags.obs_no_score ? 1 : 0, h = S.flags.huang_shares ? 1 : 0;
                const sc = S.trust.huang + S.trust.wang + S.trust.hsu;
                return { eff: { m: 4 + g + h, l: 4, e: -10 }, trust: { huang: 3, hsu: 4, wang: 2 }, set: { yi_result: sc >= 150 ? 'good' : 'ok' },
                  reply: '許老師先說：「我想讓大家看見，孩子第一次舉手。」現場安靜了兩秒，然後是一陣溫暖的掌聲。黃老師分享了他的分組設計，王老師也說了一段話。散會時有老師說：「這是我第一次在議課會上不怕被批評。」' }; } },
            { text: '請每位觀課者輪流說：「我看到孩子做了什麼」，不評論好壞', th: 'distributed.dialogic', cost: 50,
              fx: S => ({ eff: { m: 3, l: 4, e: -12 }, trust: { huang: 2, hsu: 3, wang: 1 }, set: { yi_result: 'good' },
                reply: '每位老師都說得很具體：「第三組的小美在幫別人解題」、「後面的小明一直在偷笑，但他在聽」。你發現，原來老師們比你想像的更會「看」。' }) },
            { text: '你親自逐班總評，指出優點和需要改進的地方', th: 'bureaucratic.directive', cost: 30,
              fx: S => ({ eff: { a: 3, m: S.flags.obs_scored ? -6 : -3, l: 1, e: -6 }, trust: { huang: -4, hsu: -2, wang: -3 }, set: { yi_result: 'bad' },
                reply: '你的評語很專業，但會議室裡越來越安靜。有位老師低聲說：「又變成評鑑了。」' }) },
          ],
        },
      },
      miss: { eff: { m: -8, a: -5 }, set: { yi_result: 'absent' }, log: '你沒出席議課，老師們覺得公開授課只是形式。' } },
  ],
  calls: [
    { id: 'd4_edu', caller: 'edu', time: 600, title: '教育局：校務評鑑預告',
      text: '教育局承辦人：「校長您好，貴校 12 月 17 日將接受校務評鑑，共 9 個指標。提醒您盡早成立窗口並開始整理資料。我們到時會訪談教師、家長和學生，請提早準備。」',
      choices: [
        { text: '指定林主任統籌，各處室配合提供資料', th: 'bureaucratic.directive', cost: 5, eff: { a: 3 }, trust: { lin: -4 }, flags: ['eval_lin'],
          reply: '你掛上電話，已經想像得到林主任的臉色。' },
        { text: '成立評鑑小組，各處室自己負責自己的指標，每月檢核一次', th: 'distributed.empowering', cost: 15, eff: { a: 5, e: -3 }, trust: { lin: 3, zhang: 2, chen: 2, wu: 2 }, flags: ['eval_team'],
          reply: '你把九個指標貼在牆上，請各處室認領。林主任鬆了口氣：「這樣比較合理。」' },

            { text: '請各處室主任輪流說明自己的工作，校長補充整體脈絡', th: 'distributed.empowering', cost: 30,

    { id: 'd9_wang', npc: 'wang', start: 550, end: 630, title: '委員進教室', loc: '六年級教室',
      text: S => S.flags.wang_leads_group
        ? '王老師：「校長，委員要進我的教室看課。我平常怎麼教，就怎麼教，不用刻意排練吧？」'

          : '王老師：「校長，委員要進我教室看課。我看你們行政是要我『演』一堂課吧？」',
      choices: [
        { text: '「不用演，平常怎麼教就怎麼教。委員要看的是真實。」', th: 'teacher.promote_learning', cost: 10, eff: { m: 3, l: 2, e: -2 }, trust: { wang: 6 }, flags: ['eval_class_real'],
          reply: '王老師鬆了口氣：「你這樣說，我就放心了。」那節課孩子們輪流主持討論，委員一直在做筆記。' },
        { text: '「請準備一堂比較精緻的教案，讓委員看到我們的專業。」', th: 'bureaucratic.directive', cost: 10, eff: { a: 2, m: -3 }, trust: { wang: -6 }, flags: ['eval_class_show'],

        { text: '「由你決定，我尊重你的專業。」', th: 'distributed.empowering', cost: 5, eff: { m: 2, l: 1 }, trust: { wang: 4 }, flags: ['eval_class_real'],

      ],
      miss: { eff: { m: -3 }, trust: { wang: -4 }, log: '委員進教室前，校長沒有跟王老師說過話。' } },

    { id: 'd9_huang', npc: 'huang', pos: [32, 13], start: 600, end: 680, title: '教師訪談', loc: '會議室',
      text: '黃老師：「校長，委員要訪談教師代表。需要我們先統一口徑嗎？還是自由說？」他看著你，在等你的回答。',
      choices: [
        { text: '「自由說。老師的真實聲音，比好看的答案更重要。」', th: 'distributed.dialogic', cost: 10, eff: { m: 4, a: 2 }, trust: { huang: 8 }, flags: ['interview_free'],

        { text: '「請老師們把重點講一下：共備、運動會、安全，這些成果。」', th: 'bureaucratic.directive', cost: 5, eff: { a: 1, m: -4 }, trust: { huang: -8 }, flags: ['interview_coached'],

      ],
      miss: { eff: { m: -2 }, trust: { huang: -4 }, log: '教師訪談前，校長沒有跟老師們溝通任何準備事項。' } },

    { id: 'd9_zhou', npc: 'zhou', pos: [34, 13], start: 640, end: 720, title: '家長訪談', loc: '會議室',

      choices: [
        { text: '「請家長依真實經驗回答，不必刻意說好話。」', th: 'servant.listen', cost: 10, eff: { p: 3, a: 2 }, trust: { zhou: 3 }, flags: ['interview_free'],

        { text: '把家長代表名單開放：除了會長推薦的，也隨機抽幾位家長', th: 'system.collab', cost: 25, eff: { e: -4, p: 4, a: 3 }, trust: { zhou: -2 }, flags: ['interview_free', 'parents_random'],
          reply: '周會長皺眉：「這樣不太好控制吧？」你說：「真實比好控制更重要。」' },
      ],
      miss: { eff: { p: -3 }, trust: { zhou: -4 }, log: '家長訪談前，周會長自己挑了一批「熟面孔」，評鑑委員對代表性有疑問。' } },

    { id: 'd9_student', npc: 'xiaoyu', pos: [28, 14], start: 680, end: 745, title: '學生訪談', loc: '圖書館',
      text: S => '委員要訪談學生，行政人員已經準備好了一份名單，都是班上的幹部和模範生。'
        + (S.flags.bully_result ? '\n你想起了小宇。他今天站在圖書館角落，不確定該不該出現。' : ''),
      choices: [
        { text: '「改成隨機抽籤，讓不同背景的孩子都有機會說話。」', th: 'distributed.empowering', cost: 15, eff: { l: 3, a: 3, e: -3 }, trust: { xiaoyu: 4 }, flags: ['students_random'],
          reply: '抽到的孩子有的活潑，有的害羞。委員問：「你覺得學校最需要改什麼？」有孩子說：「廁所旁邊很暗。」你默默記了下來。' },
        { text: '依原名單進行，確保訪談順暢', th: 'bureaucratic.formal_meeting', cost: 5, eff: { a: 1, l: -1 }, flags: ['students_picked'],

        { text: '邀請小宇願意的話也來說，但不強迫，也不預設他要說什麼', th: 'servant.listen', cost: 20, eff: { e: -4, l: 3 }, trust: { xiaoyu: 8 }, flags: ['students_random', 'xiaoyu_voice'],
          fx: S => ({ reply: S.flags.bully_result === 'resolved' || S.flags.bully_result === 'restorative' ? '小宇輕輕說：「現在比較好了。我有一個朋友會陪我吃午餐。」委員低頭記下來。' : '小宇沉默了很久，只說：「我希望，不要再有人被丟書包。」會議室安靜了好幾秒。' }) },

      miss: { eff: { l: -2 }, log: '學生訪談只剩下行政人員挑選的名單，沒有校長的意見。' } },

    { id: 'd9_lunch', npc: 'azhu', start: 720, end: 790, title: '委員的午餐', loc: '廚房',
      text: '阿珠姨：「校長，委員中午要在學校吃午餐，我是不是要多煮一點、擺漂亮一點？」',

        { text: '快速吃完，回去準備下午的座談', th: null, cost: 20, eff: { e: 15 },

      miss: { eff: { e: -10 }, log: '評鑑日你又沒吃午餐，下午座談前覺得頭暈。' } },

    { id: 'd9_wu', npc: 'wu', start: 740, end: 810, title: '輔導紀錄檢視', loc: '輔導室',
      text: S => '蘇委員拿起輔導紀錄翻了幾頁，抬頭問吳主任：「這份個案紀錄，通報的時間點是什麼時候？」吳主任看向你。'

        { text: '「這件事是輔導室專責，請吳主任回答。」', th: 'distributed.empowering', cost: 10, eff: { a: 1 }, trust: { wu: -3 },

          reply: '蘇委員點頭：「隱私確實要保護，不過紀錄的通報時間不涉及隱私。」你感覺自己有點下不來台。' },

      miss: { eff: { a: -3, l: -2 }, trust: { wu: -4 }, log: '委員查閱輔導紀錄時，校長沒有出現。' } },

    { id: 'd9_zhang', npc: 'zhang', start: 780, end: 850, title: '經費與採購查核', loc: '總務處',

      miss: { eff: { a: -3 }, trust: { zhang: -3 }, log: '委員查核經費時，校長沒有到場。' } },

    { id: 'd9_final', npc: 'su', pos: [36, 13], start: 870, end: 960, main: true, title: '綜合座談', loc: '會議室', label: '評鑑綜合座談｜旁白',

/* NPC 今天站在哪裡：有待處理事件且 60 分鐘內開始 → 事件地點；否則在自己的位置；訪客只在事件進行中出現 */
function npcPositions() {

    const evs = today().events.filter(ev => ev.npc === id && evPending(ev)).sort((a, b) => a.start - b.start);
    const ev = evs[0];
    let pos = null;
    if (n.visitor) { if (ev && evActive(ev)) pos = ev.pos; }
    else if (ev && ev.pos && S.clock >= ev.start - 60) pos = ev.pos;

function inClass() { const c = S.clock; return (c >= 520 && c < 720 && !(c >= 600 && c < 620)) || (c >= 800 && c < 960); }
function kidCount() { const c = S.clock; if (c >= 600 && c < 620) return 14; if (c >= 720 && c < 800) return 12; if (c >= 960) return 8; if (c < 520) return 6; return 3; }
function updateKids(dt) {
  const n = kidCount();
  for (let i = 0; i < n; i++) {
    const k = kids[i];
    if (k.wait > 0) { k.wait -= dt; continue; }
    if (!k.tx || Math.hypot(k.tx - k.x, k.ty - k.y) < 4) { k.tx = (3.5 + Math.random() * 17) * T; k.ty = (22.5 + Math.random() * 5.5) * T; k.wait = Math.random() * 2; continue; }
    const d = Math.hypot(k.tx - k.x, k.ty - k.y), sp = 70 * dt;
    k.x += (k.tx - k.x) / d * sp; k.y += (k.ty - k.y) / d * sp; k.dir = k.tx < k.x ? 'left' : 'right';
  }

/* ============ 移動與碰撞 ============ */
function blocked(x, y) {
  const pts = [[x - 13, y - 12], [x + 13, y - 12], [x - 13, y + 2], [x + 13, y + 2]];
  if (pts.some(([px, py]) => solidAt(Math.floor(px / T), Math.floor(py / T)))) return true;
  return NPCS_NOW.some(n => Math.abs(n.x - x) < 26 && Math.abs(n.y - y) < 16);
}
let walkAcc = 0;
function update(dt) {
  NPCS_NOW = npcPositions();
  updateKids(dt);
  if (mode !== 'play') { player.moving = false; return; }
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.a) dx -= 1; if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp || keys.w) dy -= 1; if (keys.ArrowDown || keys.s) dy += 1;
  player.moving = !!(dx || dy);
  if (player.moving) {
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    player.dir = dy < 0 ? 'up' : dy > 0 ? 'down' : dx < 0 ? 'left' : 'right';
    if (dx) player.dir = dx < 0 ? 'left' : 'right';
    if (dy && !dx) player.dir = dy < 0 ? 'up' : 'down';
    const sp = (S.stats.e < 20 ? 150 : 215) * dt;
    const nx = player.x + dx * sp, ny = player.y + dy * sp;
    if (!blocked(nx, player.y)) player.x = nx;
    if (!blocked(player.x, ny)) player.y = ny;
    player.anim += dt;
  }
  // 即時時鐘：每 0.6 秒 = 1 分鐘（對話、視窗開著時暫停）
  walkAcc += dt;
  if (walkAcc >= SEC_PER_MIN) { walkAcc -= SEC_PER_MIN; spend(1); }

  for (const c of (today().calls || [])) if (!S.calls[c.id] && S.clock >= c.time && (!c.when || c.when(S))) { openCall(c); return; }
  if (S.clock >= DAY_END) endDay();
}

  const head = { A: '一所被看見的學校', B: '一所正在成形的學校', C: '一所還在摸索的學校', D: '一所需要重新出發的學校' }[g.id];
  const lv = v => GEN.LEVELS.find(L => v >= L.min && v <= L.max) || GEN.LEVELS[0];
  const bar = (label, v, col) => `<div class="stat" style="max-width:420px"><span>${label} ${v}</span><div class="bar"><i style="width:${v}%;background:${col}"></i></div></div>`;
  const dims = EVAL_DIMS.map(d => bar(d.label, sc[d.k], sc[d.k] >= 68 ? '#38a169' : sc[d.k] >= 55 ? '#d69e2e' : '#e53e3e')).join('');
  const items = summaryItems(S).map(([t, s]) => `<tr><td class="mut" style="white-space:nowrap">${t}</td><td>${s}</td></tr>`).join('');
  const keyP = ['wang', 'huang', 'hsu', 'lin', 'chen', 'zhang', 'wu', 'limom', 'zhou', 'xiaoyu'];
  const ppl = keyP.filter(k => S.trust[k] != null).map(k => { const v = S.trust[k], L = lv(v); return `<span style="white-space:nowrap">${NPC[k].name} <b style="color:${L.color}">${v}</b>（${L.label}）</span>`; }).join('　');
  let cnt = {}, total = 0;
  for (const k in S.tally) { const m = modeOf(k); cnt[m] = (cnt[m] || 0) + S.tally[k]; total += S.tally[k]; }
  const order = Object.keys(GEN.MODES).sort((a, b) => (cnt[b] || 0) - (cnt[a] || 0));
  const modeBars = order.map(m => bar(`${GEN.MODES[m].label}（${cnt[m] || 0} 次）`, total ? Math.round((cnt[m] || 0) / total * 100) : 0, '#ffd166')).join('');
  const top = tm ? MODE_FB[tm.m] : null, least = order[order.length - 1];
  const share = tm && total ? Math.round(cnt[tm.m] / total * 100) : 0;
  const styleHTML = tm ? `<p>這學期你共做了 ${total} 次帶有領導風格的決定，最常用的是 <b style="color:var(--gold)">${GEN.MODES[tm.m].label}</b>（${share}%），最少用的是 ${GEN.MODES[least].label}（${cnt[least] || 0} 次）。</p>
    <div class="card"><b>你的優勢</b>：${top.strong}<br><b>要留意</b>：${top.risk}<br><b>想一想</b>：${top.q}</div>${theoryHTML(tm.arch)}` : '<p class="mut">尚無資料</p>';
  const hist = S.history.map(h => `<span class="mut" style="white-space:nowrap">第 ${h.day + 1} 天 ${h.title}</span>`).join('　');
  openModal(`<h1>第一學期結束</h1><p class="mut">青禾國小・第一學期　${hist}</p>
    <div class="card" style="text-align:center"><div class="mut">校務評鑑</div><div style="font-size:42px;font-weight:bold;color:var(--gold)">${g.label}</div><div><b>${head}</b></div></div>
    <canvas id="radar" width="360" height="300" style="display:block;margin:0 auto"></canvas>
    <div class="card"><b>評鑑五個面向</b>${dims}<div class="mut" style="font-size:12px;margin-top:6px">經費剩下 ${S.stats.b} 萬。評鑑等第由學期累積的決定與紀錄推算，遊戲內的設定僅供教學討論。</div></div>
    <h3>這學期你留下了什麼</h3><table class="lg">${items}</table>
    <h3>人與人的關係</h3><div class="card" style="line-height:1.9">${ppl}</div>
    <h3>你的領導風格</h3>${modeBars}${styleHTML}
    <h3>課堂討論題</h3><div class="card">1. 這學期哪一個決定，你事後最想重來一次？重來的話，你會先做什麼？<br>2. 王老師、黃老師、許老師的信任，各自是怎麼升高（或降低）的？<br>3. 你的「看見」，在小宇的事上有沒有早一點發生？是什麼讓你看見，或沒看見？<br>4. 有哪些時刻，你在「誠實」和「保護學校形象」之間拉扯？你怎麼選？<br>5. 你最常用的風格，是你的優勢，還是你的舒適圈？下學年你想練習哪一種？</div>
    <div class="row"><button class="btn gold" id="again">重新開始</button></div>`);
  drawRadar();
  $('again').onclick = () => { localStorage.removeItem(SAVE_KEY); S = newState(); startDay(0); };
}
function drawRadar() {
  const c = $('radar').getContext('2d'), cx = 180, cy = 150, R = 105;
  const ax = [['m', '教師士氣'], ['l', '學生學習'], ['p', '家長信任'], ['a', '行政效能']];
  c.font = '14px "PingFang TC",sans-serif'; c.textAlign = 'center';
  for (let lv = 1; lv <= 4; lv++) { c.beginPath(); ax.forEach((_, i) => { const an = -Math.PI / 2 + i * Math.PI * 2 / ax.length, r = R * lv / 4; c[i ? 'lineTo' : 'moveTo'](cx + Math.cos(an) * r, cy + Math.sin(an) * r); }); c.closePath(); c.strokeStyle = '#4a5070'; c.stroke(); }
  c.beginPath(); ax.forEach(([k], i) => { const an = -Math.PI / 2 + i * Math.PI * 2 / ax.length, r = R * S.stats[k] / 100; c[i ? 'lineTo' : 'moveTo'](cx + Math.cos(an) * r, cy + Math.sin(an) * r); }); c.closePath();
  c.fillStyle = '#ffd16655'; c.fill(); c.strokeStyle = '#ffd166'; c.lineWidth = 2; c.stroke();
  ax.forEach(([k, l], i) => { const an = -Math.PI / 2 + i * Math.PI * 2 / ax.length; c.fillStyle = '#f3ecd8'; c.fillText(`${l} ${S.stats[k]}`, cx + Math.cos(an) * (R + 26), cy + Math.sin(an) * (R + 22) + 5); });
}

/* ============ 標題、說明、人物 ============ */
function helpHTML() {
  return `<h3>操作</h3>方向鍵／WASD：走路　空白鍵／Enter：對話、確認　數字鍵 1–5：選選項　T：等 15 分鐘
  <h3>規則</h3>・時間從 07:30 跑到 16:30，<b>時鐘會一直走</b>（對話時暫停），處理事情也要花時間，<b>一天做不完所有事</b>。<br>
  ・待辦清單只會告訴你事情「幾點開始」，不會告訴你對方能等多久（重要行程除外）。<br>
  ・頭上有 <b style="color:#ff6b6b">!</b> 的人正在找你，<b style="color:var(--gold)">★</b> 是重要行程，<b>…</b> 代表等等會有事。超過時間沒處理就算錯過，會有後果。<br>
  ・體力不夠時，有些選項會不能選；吃午餐、在辦公桌休息可以回復。<br>
  ・每個人對你的信任會累積。信任不夠時，有些做法會被打折扣甚至反效果。<br>
  ・你今天的決定，會影響之後幾天發生的事。<br>
  ・每個選擇背後都對應一種領導風格，每天結束時揭曉。`;
}
function showTitle() {
  mode = 'title';
  const sv = load();
  const img = sprite('principal', 'm', NPC.principal.pal).toDataURL();
  openModal(`<div style="text-align:center"><img src="${img}" style="width:96px;image-rendering:pixelated"><h1>校長的一天</h1><p class="mut">青禾國小・第一學期</p></div>
    <p>你是青禾國小新上任的校長。學校有 24 班、600 個孩子、50 位教職員。少子化、家長高度關注、新課綱推動、資深老師倦怠……每一天都有做不完的事。</p>
    <p>你要在 10 個學期關鍵日裡，好好經營這所學校。<span class="mut">（從開學日到期末，一個學期共 10 天）</span></p>
    <div class="card">${helpHTML()}</div>
    <div class="row">${sv && sv.dayStart ? `<button class="btn gold" id="cont">繼續：${(sv.nextDay ?? sv.day) >= DAYS.length ? '看總結' : '第 ' + ((sv.nextDay ?? sv.day) + 1) + ' 天' + (sv.nextDay == null ? '（從 07:30 重新開始）' : '')}</button>` : ''}<button class="btn ${sv && sv.dayStart ? '' : 'gold'}" id="newg">開始新遊戲</button></div>
    <p class="mut" style="font-size:12px">學校與人物皆為虛構。理論引用取自本系列 v2 查證過的文獻白名單。</p>`);
  if ($('cont')) $('cont').onclick = () => { S = Object.assign(newState(), sv); closeModal(); const nd = S.nextDay ?? S.day; if (nd >= DAYS.length) showFinal(); else startDay(nd, S.nextDay != null); };
  $('newg').onclick = () => { S = newState(); closeModal(); startDay(0); };
}
function showPeople() {
  if (!S || mode !== 'play') return;
  mode = 'modal';
  const lv = v => GEN.LEVELS.find(L => v >= L.min && v <= L.max) || GEN.LEVELS[0];
  const h = Object.keys(NPC).filter(k => k !== 'principal' && S.trust[k] != null && (NPC[k].home || S.met[k])).map(k => {
    const n = NPC[k], v = S.trust[k], L = lv(v);
    return `<div class="ppl"><img src="${npcSprite(k).toDataURL()}" alt=""><div style="flex:1"><b>${n.name}</b> <span class="mut">${n.role}</span><br><span style="font-size:13px">${n.blurb}</span>
      <div class="stat" style="max-width:260px"><span>信任 ${v}（<span style="color:${L.color}">${L.label}</span>）</span><div class="bar"><i style="width:${v}%;background:${L.color}"></i></div></div></div></div>`;
  }).join('');
  openModal(`<h2>👥 青禾國小的人們</h2>${h}<div class="row"><button class="btn gold" id="cl">關閉</button></div>`);
  $('cl').onclick = () => { closeModal(); mode = 'play'; };
}

/* ============ 輸入 ============ */
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (mode === 'modal' || mode === 'title' || mode === 'summary') return;  // 交給按鈕原生的 Enter／空白鍵
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (mode === 'dialog' && /^[1-9]$/.test(k)) { const b = $('dChoices').querySelectorAll('button')[+k - 1]; if (b && !b.disabled) b.click(); return; }
  if (k === ' ' || k === 'Enter') { if (!e.repeat) interact(); return; }
  if (k === 't' && mode === 'play') return waitAWhile();
  keys[k] = true;
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#pad [data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
});
$('bA').onclick = interact;
$('bWait').onclick = waitAWhile;
$('bPeople').onclick = showPeople;
$('bHelp').onclick = () => { if (mode !== 'play') return; mode = 'modal'; openModal(`<h2>❔ 遊戲說明</h2>${helpHTML()}<div class="row"><button class="btn gold" id="cl">關閉</button></div>`); $('cl').onclick = () => { closeModal(); mode = 'play'; }; };

/* ============ 主迴圈 ============ */
buildMap();
let lastT = performance.now(), hudT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if (S) update(dt);
  draw(t); drawMini(t);
  hudT += dt; if (hudT > 1 && S) { hudT = 0; renderHUD(); }
  requestAnimationFrame(loop);
}
player.x = 20 * T; player.y = 15 * T;
renderHUD(); showTitle();
requestAnimationFrame(loop);
</script>
</body>
</html>
